<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Server Hub</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <meta http-equiv="refresh" content="0;url=/login?show=signup" />
  <style>
    :root {
      --bg: #0e0e10;
      --panel: #18181b;
      --field: #1f1f23;
      --border: rgba(255,255,255,0.08);
      --text: #fafafa;
      --muted: #a1a1aa;
      --subtle: #71717a;
      --radius: 14px;
      --ease: cubic-bezier(0.2,0.8,0.2,1);
    }
    html.light { --bg:#f4f4f5; --panel:#ffffff; --field:#fafafa; --border:rgba(0,0,0,0.08); --text:#18181b; --muted:#71717a; --subtle:#a1a1aa; }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center;padding:24px;background:var(--bg);background-image:linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);background-size:32px 32px}
    html.light body{background-image:linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px)}
    .shell{width:min(100%,400px);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:36px 32px 32px;text-align:center}
    a{color:var(--muted);text-decoration:none}a:hover{color:var(--text);text-decoration:underline}
  </style>
</head>
<body>
  <main class="shell" aria-label="Redirect">
    <p style="color:var(--muted);font-size:0.9rem">Redirecting to sign-up…</p>
    <p style="margin-top:12px;font-size:0.85rem"><a href="/login?show=signup">Click here if not redirected</a></p>
  </main>
  <script>
    (function(){
      var root=document.documentElement;
      try{ root.classList.toggle('light', !window.matchMedia('(prefers-color-scheme: dark)').matches); }catch{}
      var target='/login?show=signup';
      if(location.search) {
        // preserve error params from server redirects (e.g. ?error=1)
        var q=new URLSearchParams(location.search);
        if(q.get('error')) target+='&error='+encodeURIComponent(q.get('error'));
      }
      location.replace(target);
    })();
  </script>
</body>
</html>
